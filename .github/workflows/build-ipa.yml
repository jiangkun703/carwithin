name: Build patched IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从官方发布包补充 MFi 身份文件
        run: |
          set -e
          curl -fL -o /tmp/cw.ipa "https://github.com/xmz28/CarWithin/releases/download/v1.0.4/CarWithin-1.0.4-unsigned.ipa"
          unzip -q -o /tmp/cw.ipa -d /tmp/cwipa
          APP=$(find /tmp/cwipa/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "identity from: $APP"
          mkdir -p App/BundledIdentity
          cp "$APP/certificate.p7b" "$APP/leaf.cer" "$APP/private.x963" App/BundledIdentity/
          ls -la App/BundledIdentity

      - name: 打 Wi-Fi 地址兜底补丁
        run: |
          set -e
          : > /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          echo -n '' >> /tmp/p.b64
          openssl base64 -d -A -in /tmp/p.b64 -out /tmp/carwithin.patch
          head -5 /tmp/carwithin.patch
          patch -p1 --dry-run < /tmp/carwithin.patch
          patch -p1 < /tmp/carwithin.patch

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build | tail -60

      - name: 打包成 IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry CarWithin-patched-unsigned.ipa Payload
          ls -lh CarWithin-patched-unsigned.ipa
          shasum -a 256 CarWithin-patched-unsigned.ipa | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CarWithin-patched-unsigned
          path: |
            out/CarWithin-patched-unsigned.ipa
            out/sha256.txt
          retention-days: 30
